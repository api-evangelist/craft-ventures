aid: craft-ventures
name: Craft Ventures
description: >-
  Craft Ventures is a San Francisco-based venture capital firm founded in late
  2017 by repeat entrepreneurs David Sacks and Bill Lee, built "by founders for
  founders" and rooted in the operator playbook of the PayPal Mafia. The firm
  invests across early and growth stages, writing checks that range from micro-seed
  positions through double-digit millions, and specializes in B2B SaaS,
  marketplaces, and enterprise software prized for high-growth, high-margin,
  recurring-revenue economics. Craft is known for its rigorous, metrics-driven
  SaaS operating framework and hands-on support spanning talent, go-to-market,
  community, and finance. Beyond core SaaS, the portfolio spans artificial
  intelligence, developer tools, fintech and crypto, cybersecurity, digital health,
  defense, and frontier technology. The firm manages roughly $3.3 billion in
  assets across four early-stage funds and two growth funds, including Craft
  Ventures IV ($712M) and Craft Ventures Growth II ($608M). Notable investments
  include Airbnb, Affirm, Reddit, Uber, Lyft, Palantir, Slack, ElevenLabs,
  Supabase, Anduril, and Neuralink. Headquartered in San Francisco, with offices
  in New York City and Austin, Texas, and a primarily United States geographic focus.
